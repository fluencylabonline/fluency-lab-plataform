name: Learning & Practice Reminders Cron

on:
  schedule:
    # 12:00, 16:00, 20:00 and 00:00 UTC = 09h, 13h, 17h and 21h in Brasília.
    # Lembretes de prática são push, que não pode sair de madrugada.
    - cron: '0 12,16,20,0 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  reminders:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Learning Reminders API
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Error: NEXT_PUBLIC_APP_URL secret is not set."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "Error: CRON_SECRET secret is not set."
            exit 1
          fi

          BASE_URL="${APP_URL%/}"
          echo "Triggering Cron at: $BASE_URL/api/cron/learning"

          RESPONSE=$(curl -sL -w "\nHTTP_STATUS:%{http_code}" -X POST "$BASE_URL/api/cron/learning" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")

          echo "Response output:"
          echo "$RESPONSE"

          if [[ "$RESPONSE" == *"HTTP_STATUS:200"* ]]; then
            echo "Cron executed successfully!"
          else
            echo "Cron execution failed!"
            exit 1
          fi
