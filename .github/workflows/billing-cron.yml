name: Billing Cron

on:
  schedule:
    # Run daily at 12:00 UTC = 09:00 in Brasília. Cobranças enviam email,
    # WhatsApp e push, que não podem sair de madrugada (00:00-07:00).
    - cron: "0 12 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  billing:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Billing API
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Error: NEXT_PUBLIC_APP_URL secret is not set."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "Error: CRON_SECRET secret is not set."
            exit 1
          fi

          BASE_URL="${APP_URL%/}"
          echo "Triggering Cron at: $BASE_URL/api/cron/billing"

          RESPONSE=$(curl -sL -w "\nHTTP_STATUS:%{http_code}" -X POST "$BASE_URL/api/cron/billing" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")

          echo "Response output:"
          echo "$RESPONSE"

          if [[ "$RESPONSE" == *"HTTP_STATUS:200"* ]]; then
            echo "Cron executed successfully!"
          else
            echo "Cron execution failed!"
            exit 1
          fi
